<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Risk Agent</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
<header>
  <div class="brand">⛈️ Weather Risk Intelligence Agent</div>
  <div class="header-actions">
    <span id="model" class="muted"></span>
    <button id="new-chat" class="ghost">New chat</button>
  </div>
</header>

<main>
  <aside id="leaderboard">
    <div class="lb-head">
      <h2>Hub risk ranking</h2>
      <select id="lb-hazard">
        <option value="overall">Overall disruption risk</option>
        <option value="winter">Winter</option>
        <option value="flood">Flood</option>
        <option value="hurricane">Hurricane</option>
        <option value="severe_storm">Severe storm</option>
        <option value="heat">Extreme heat</option>
      </select>
    </div>
    <ol id="lb-list"></ol>
    <p class="muted small" id="lb-meta"></p>
  </aside>

  <section id="chat">
    <div id="messages">
      <div class="msg agent intro">
        <p>Hi! I rank our hubs by weather-disruption exposure using FEMA hazard data and 5 years of observed
          weather. Every number comes from a deterministic scoring model; I retrieve and explain it.</p>
        <div class="chips" id="starter-chips"></div>
      </div>
    </div>
    <form id="composer">
      <input id="input" autocomplete="off" placeholder="Ask about hub weather risk…" maxlength="2000">
      <button type="submit" id="send">Send</button>
    </form>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
